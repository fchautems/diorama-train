<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Muids — debug plan</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#111;color:#eee}
  #app{height:100%;display:grid;grid-template-rows:auto 1fr}
  .bar{padding:10px 12px;background:#1b1d20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333}
  label{font-size:13px}
  button,input{font:inherit}
  .stage{position:relative;overflow:auto;background:#222}
  .wrap{position:relative;width:min(100vw,1412px);aspect-ratio:1412/792;margin:auto}
  #bg,#svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #bg{opacity:.72;display:none}
  #svg{overflow:visible}
  .hint{font-size:12px;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <strong>Le Muids · blueprint debug</strong>
    <label>Capture satellite <input id="file" type="file" accept="image/*"></label>
    <label><input id="real" type="checkbox" checked> réel</label>
    <label><input id="fiction" type="checkbox" checked> fiction</label>
    <label><input id="buildings" type="checkbox" checked> bâtiments/jardins</label>
    <label>fond <input id="opacity" type="range" min="0" max="100" value="72"></label>
    <span class="hint">La capture reste locale dans ton navigateur, elle n'est pas ajoutée au repo.</span>
  </div>
  <div class="stage">
    <div class="wrap">
      <img id="bg" alt="">
      <svg id="svg" viewBox="0 0 1412 792"></svg>
    </div>
  </div>
</div>
<script type="module">
const data = await (await fetch('./data/le_muids_layout_v01.json')).json();
const svg = document.querySelector('#svg');
const NS = 'http://www.w3.org/2000/svg';

function el(name, attrs={}) {
  const n = document.createElementNS(NS,name);
  for (const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
  return n;
}
function pts(p){return p.map(([x,y])=>x+','+y).join(' ')}
function path(points, stroke, width, cls, dash='') {
  const p=el('polyline',{points:pts(points),fill:'none',stroke,'stroke-width':width,'stroke-linecap':'round','stroke-linejoin':'round',class:cls});
  if(dash)p.setAttribute('stroke-dasharray',dash);
  svg.appendChild(p);
  return p;
}
function poly(points, fill, stroke, width, cls) {
  const p=el('polygon',{points:pts(points),fill,stroke,'stroke-width':width,class:cls});
  svg.appendChild(p);
  return p;
}
function circle([x,y], r, fill, stroke, cls) {
  const c=el('circle',{cx:x,cy:y,r,fill,stroke,'stroke-width':3,class:cls});
  svg.appendChild(c);
  return c;
}

// Real geometry traced directly against the reference image.
path(data.real.roads.route_cantonale,'#00dcff',7,'real');
for (const [name,r] of Object.entries(data.real.roads)) {
  if(name==='route_cantonale') continue;
  path(r,'#50ffb4',5,'real');
}
for (const r of data.real.railway) path(r,'#ffffff',5,'real');
for (const g of data.real.gardens) poly(g.polygon,'rgba(100,255,80,.12)','#78ff64',2,'real buildingLayer');
for (const b of data.real.buildings) poly(b.polygon,'rgba(255,70,190,.18)','#ff46be',3,'real buildingLayer');

// Fictional diorama infrastructure.
path(data.fiction.rail_loop,'rgba(255,60,50,.65)',15,'fiction');
path(data.fiction.rail_loop,'#5b0000',4,'fiction');
path(data.fiction.inner_road_loop,'rgba(255,180,20,.75)',20,'fiction');
path(data.fiction.inner_road_loop,'#fff0ba',7,'fiction');
for(const t of data.fiction.tunnels) circle(t.center,15,'#3c5aff','#ffffff','fiction');

// Station anchor.
circle([161,486],13,'#ffffff','#111111','real');

function sync(){
  document.querySelectorAll('.real').forEach(n=>n.style.display=document.querySelector('#real').checked?'':'none');
  document.querySelectorAll('.fiction').forEach(n=>n.style.display=document.querySelector('#fiction').checked?'':'none');
  document.querySelectorAll('.buildingLayer').forEach(n=>n.style.display=document.querySelector('#buildings').checked?'':'none');
}
['real','fiction','buildings'].forEach(id=>document.querySelector('#'+id).addEventListener('change',sync));
sync();

const bg=document.querySelector('#bg');
document.querySelector('#file').addEventListener('change',e=>{
  const f=e.target.files?.[0];
  if(!f)return;
  bg.src=URL.createObjectURL(f);
  bg.style.display='block';
});
document.querySelector('#opacity').addEventListener('input',e=>bg.style.opacity=Number(e.target.value)/100);
</script>
</body>
</html>
