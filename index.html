<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>diorama-train</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#bfddeb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2730}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    .hud{position:absolute;left:16px;top:16px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.13);max-width:390px;z-index:2}
    .hud strong{display:block;margin-bottom:4px}
    .hud small{display:block;opacity:.72;margin-bottom:9px}
    .controls{display:flex;gap:7px;flex-wrap:wrap}
    button{border:1px solid rgba(0,0,0,.14);background:white;border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit}
    button:hover{background:#f3f5f6}
    #status{margin-top:9px;font-size:12px;opacity:.78;line-height:1.35}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div class="hud">
      <strong>diorama-train · v0.3</strong>
      <small>Souris : tourner · molette : zoom · clic droit : déplacer</small>
      <div class="controls">
        <button id="pauseBtn" type="button">⏸ Pause</button>
        <button id="nightBtn" type="button">🌙 Nuit</button>
        <button id="resetBtn" type="button">↺ Vue initiale</button>
      </div>
      <div id="status">Chargement du village…</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
