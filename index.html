<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>diorama-train — asset gallery</title>
  <style>
    html,body{margin:0;height:100%;background:#dbe7ee;font-family:system-ui,sans-serif;color:#1d2730}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    .hud{position:absolute;left:16px;top:16px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.84);backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.12);max-width:320px}
    .hud strong{display:block;margin-bottom:3px}.hud small{opacity:.72}
    #status{margin-top:7px;font-size:12px}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div class="hud">
      <strong>diorama-train · asset gallery v0.1</strong>
      <small>Souris: tourner · molette: zoom · clic droit: déplacer</small>
      <div id="status">Chargement des assets…</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
